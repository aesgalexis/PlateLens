name: PlateLens CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run parser regression corpus
        run: node tests/parser.test.mjs && node tests/mega-corpus.test.mjs && node tests/online-50.test.mjs && node tests/presence.test.mjs && node tests/runtime-wiring.test.mjs && node tests/orientation.test.mjs
